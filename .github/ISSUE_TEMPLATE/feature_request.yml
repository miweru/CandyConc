name: Suggest an improvement
description: Describe a research task CandyConc could support better.
title: "[Suggestion]: "
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe your research or analysis task and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: What would help, and how would you use it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or example
      description: Optional. Use synthetic data or material you have permission to share.
