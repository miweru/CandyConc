name: Bug report
description: Report a problem that can be reproduced.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use [private reporting](https://github.com/miweru/CandyConc/security/advisories/new).
        Please use a small synthetic example and remove credentials and private corpus data.
  - type: input
    id: version
    attributes:
      label: CandyConc version
      description: Run candy --version or check the release you downloaded.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and installation
      placeholder: "macOS 15 on Apple silicon, application bundle, Safari"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the search query, settings, or a small example file where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error message or a screenshot if useful.
    validations:
      required: true
