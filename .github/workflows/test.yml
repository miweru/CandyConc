# Tests on every push and pull request: backend without corpus and without a
# language model, the web interface, the documentation, and one packaged
# install (wheel with the built interface in a fresh environment).
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  # Portable native extensions, the same setting as the release wheels.
  CANDYCONC_ENABLE_OPENMP: "off"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: app
    env:
      PYTHONPATH: src
      # Point any model endpoint at a closed port: the tests never reach a model.
      COPILOT_ENDPOINT: http://127.0.0.1:9/v1/responses
      CANDYCONC_GEMMA_EMB_ENDPOINT: http://127.0.0.1:9/v1/embeddings
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt Cython
      - name: Lint
        run: make lint
      - name: Build native extensions
        run: make native
      - name: Tests (no corpus, no model)
        run: python -m pytest -q -m "not integration" tests

  frontend:
    name: Web interface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candyconc-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candyconc-web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Backend dependencies for interface contract tests
        run: python -m pip install -r ../app/requirements.txt
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unit tests
        run: npx vitest run

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Documentation toolchain
        run: python -m pip install -r docs/requirements.txt
      # The documented build: every warning is an error (house style in the
      # text and in the rendered page titles included), every internal link
      # must resolve.
      - name: Build the documentation
        run: python -m sphinx -W --keep-going -n -b html docs docs/_build/html
      # The section of the current version and every link in it.
      - name: Release notes of the current version
        run: python packaging/release_notes.py --output "$RUNNER_TEMP/RELEASE_NOTES.md"

  package:
    name: Wheel with interface, installed and checked
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candyconc-web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # setup-uv publishes full version tags only (v10.2.0, no v10).
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build the web interface into the package
        run: python packaging/build_web.py --install
      - name: Build sdist and wheel from the sdist
        env:
          CANDYCONC_REQUIRE_WEB_DIST: "1"
        run: uv build --out-dir dist app
      - name: Install the wheel in a fresh environment and check it
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/candy" --version
          "$RUNNER_TEMP/venv/bin/python" -m candyconc.tools.install_smoke --require-web
